name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: "SSH verbose (-vvv)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Endpoint SSH publicado no Cloudflare Tunnel e protegido por Cloudflare Access
      SSH_HOST: ssh.dev.quintadafontinha.pt
      SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/quintadafontinha' }}
      SSH_VERBOSE: ${{ inputs.debug && '-vvv' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          missing=0
          for v in SSH_PRIVATE_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v em falta"; missing=1; fi
          done
          [ -z "$SSH_KNOWN_HOSTS" ] && echo "::warning::SSH_KNOWN_HOSTS em falta - host key aceite no primeiro contacto"
          case "$CF_ACCESS_CLIENT_ID" in *.access) ;; *) echo "::warning::CF_ACCESS_CLIENT_ID normalmente termina em '.access'";; esac
          if [ -n "$SSH_KNOWN_HOSTS" ] && ! grep -qF "$SSH_HOST " <<<"$SSH_KNOWN_HOSTS"; then
            echo "::warning::SSH_KNOWN_HOSTS refere outro hostname ($(awk '{print $1}' <<<"$SSH_KNOWN_HOSTS" | head -1)); a chave será associada a $SSH_HOST"
          fi
          grep -q "BEGIN OPENSSH PRIVATE KEY" <<<"$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY não parece uma chave OpenSSH"; missing=1; }
          echo "Host: $SSH_HOST | User: $SSH_USER | Path: $DEPLOY_PATH"
          exit $missing

      - name: Check Cloudflare Access (service token)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "https://$SSH_HOST/")
          echo "HTTP $code"
          case "$code" in
            302|401|403)
              echo "::error::Access rejeitou o service token (HTTP $code). Verifique a política 'Service Auth' na aplicação $SSH_HOST e o Client ID/Secret."
              exit 1 ;;
          esac

      - name: Install cloudflared
        run: |
          if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o cloudflared.deb \
               https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb; then
            sudo dpkg -i cloudflared.deb
          else
            echo "::warning::Download do GitHub falhou - a instalar via repositório APT da Cloudflare"
            sudo mkdir -p --mode=0755 /usr/share/keyrings
            curl -fsSL --retry 5 https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
              | sudo tee /etc/apt/sources.list.d/cloudflared.list
            sudo apt-get update -qq && sudo apt-get install -y -qq cloudflared
          fi
          cloudflared --version

      - name: Configure SSH via Cloudflare Tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::SSH_PRIVATE_KEY inválida"; exit 1; }
          echo "Fingerprint da chave de deploy: $(ssh-keygen -lf ~/.ssh/id_deploy)"

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Fixa a(s) host key(s) do secret ao endpoint atual, independentemente do hostname registado
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' | awk -v h="$SSH_HOST" 'NF>=3 && $1 !~ /^#/ {$1=h; print}' > ~/.ssh/known_hosts
            ssh-keygen -lf ~/.ssh/known_hosts
            STRICT=yes
          else
            STRICT=accept-new
          fi

          cat > ~/.ssh/config <<EOF
          Host $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking $STRICT
            ServerAliveInterval 30
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
          EOF
          chmod 600 ~/.ssh/config

      - name: Test connection
        run: |
          set +e
          ssh -v $SSH_VERBOSE "$SSH_HOST" 'echo "OK: $(whoami)@$(hostname)"; test -w "'"$DEPLOY_PATH"'" && echo "DEPLOY_PATH gravável" || { echo "DEPLOY_PATH sem permissão de escrita"; exit 2; }' 2> ssh_debug.log
          rc=$?
          if [ $rc -ne 0 ]; then
            # Resumo do diagnóstico como annotations (sem linhas que possam conter credenciais)
            summary=$(grep -viE 'proxy command|service-token|secret|Executing|load_hostkeys|expecting|kex: |KEX_ECDH' ssh_debug.log \
              | grep -iE 'verification failed|IDENTIFICATION HAS CHANGED|host key is known|Host key for|Server host key|known_hosts:[0-9]|matching host key|continue:|Offering|Server accepts|Permission denied|Authenticated|closed|refused|websocket|status code|bad handshake|error' \
              | sed 's/^debug1: //' | head -15 | paste -sd '|' -)
            echo "::error title=ssh-diagnostico::${summary:-sem linhas relevantes}"
            echo "::error title=known_hosts (secret)::$(ssh-keygen -lf ~/.ssh/known_hosts 2>&1 | paste -sd '|' -)"
            echo "::error title=ssh_debug tail::$(grep -viE 'proxy command|service-token|secret|Executing' ssh_debug.log | tail -4 | sed 's/^debug1: //' | paste -sd '|' -)"
            echo "::error::Falha SSH (exit $rc). 255 = ligação/autenticação; 2 = permissões em DEPLOY_PATH."
          fi
          rm -f ssh_debug.log
          exit $rc

      - name: Sync files with rsync
        run: |
          rsync -az --delete --itemize-changes \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude 'server' \
            --exclude 'README.md' \
            --exclude '.DS_Store' \
            -e "ssh $SSH_VERBOSE" \
            ./ "$SSH_HOST:$DEPLOY_PATH/"

      - name: Verify site
        continue-on-error: true
        run: curl -sS -o /dev/null -w "https://dev.quintadafontinha.pt -> HTTP %{http_code}\n" --max-time 20 https://dev.quintadafontinha.pt/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/config
